        function normTxt(s) {
            return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        }

        function skillPill(key, kind) {
            const sk = SALES_SKILLS.find(s => s.key === key);
            if (!sk) return '';
            return `<span class="skill-pill ${kind}">${sk.emoji} ${sk[currentLang]}</span>`;
        }

        // Cada competência entra SÓ de um lado (forte OU a desenvolver), nunca nos
        // dois — o saldo é (menções como ponto forte) - (menções como melhoria).
        function computeNetSkills(strengthCounts, gapCounts) {
            const strengths = [], gaps = [];
            SALES_SKILLS.forEach(sk => {
                const s = (strengthCounts && strengthCounts[sk.key]) || 0;
                const g = (gapCounts && gapCounts[sk.key]) || 0;
                const net = s - g;
                if (net > 0) strengths.push({ key: sk.key, count: s, net });
                else if (net < 0) gaps.push({ key: sk.key, count: g, net });
            });
            strengths.sort((a, b) => b.net - a.net || b.count - a.count);
            gaps.sort((a, b) => a.net - b.net || b.count - a.count);
            return { strengths, gaps };
        }

        function renderSkillPillsFromList(list, kind, emptyLabel) {
            if (!list.length) return `<span class="skill-pill neutral">${emptyLabel}</span>`;
            return list.map(({ key, count }) => {
                const sk = SALES_SKILLS.find(s => s.key === key);
                if (!sk) return '';
                return `<span class="skill-pill ${kind}">${sk.emoji} ${sk[currentLang]} <span class="skill-pill-count">×${count}</span></span>`;
            }).join('');
        }

        function renderSkillSynthesis(strengthCounts, gapCounts) {
            const L = ui[currentLang];
            const { strengths, gaps } = computeNetSkills(strengthCounts, gapCounts);
            return `
                <div class="skill-legend">${L.skillLegend}</div>
                <div class="skill-synthesis">
                    <div class="skill-synthesis-col">
                        <h5 class="ss-col-title strength"><i class="fas fa-circle-check"></i> ${L.strengthsLabel}</h5>
                        <div class="ss-col-pills">${renderSkillPillsFromList(strengths, 'strength', L.noPatternYet)}</div>
                    </div>
                    <div class="skill-synthesis-col">
                        <h5 class="ss-col-title gap"><i class="fas fa-triangle-exclamation"></i> ${L.improvementsLabel}</h5>
                        <div class="ss-col-pills">${renderSkillPillsFromList(gaps, 'gap', L.noPatternYet)}</div>
                    </div>
                </div>
            `;
        }

        // Junta nomes de competências em uma frase natural: "A, B e C"
        function joinSkillLabels(keys, max) {
            const labels = (keys || []).slice(0, max).map(k => {
                const sk = SALES_SKILLS.find(s => s.key === k);
                return sk ? sk[currentLang] : null;
            }).filter(Boolean);
            if (!labels.length) return '';
            if (labels.length === 1) return labels[0];
            const conj = currentLang === 'fr' ? 'et' : 'e';
            return `${labels.slice(0, -1).join(', ')} ${conj} ${labels[labels.length - 1]}`;
        }

        // Resumo executivo em texto corrido — característica geral da área,
        // baseada nas competências de venda consultiva esperadas pela MetLife.
        function areaExecutiveSummary(area) {
            const L = ui[currentLang];
            const areaLabel = L['area' + area.area.replace(/\s/g, '')] || area.area;
            const { strengths, gaps } = computeNetSkills(area.strengthCounts, area.gapCounts);
            const strengthsTxt = joinSkillLabels(strengths.map(s => s.key), 3);
            const gapsTxt = joinSkillLabels(gaps.map(g => g.key), 2);
            if (currentLang === 'fr') {
                let s = `L'équipe ${areaLabel} affiche un score moyen de ${area.avgScore}%.`;
                if (strengthsTxt) s += ` Bonne maîtrise de : ${strengthsTxt}.`;
                if (gapsTxt) s += ` Points de développement : ${gapsTxt}.`;
                return s;
            }
            let s = `A área de ${areaLabel} tem score médio de ${area.avgScore}%.`;
            if (strengthsTxt) s += ` Bom domínio de ${strengthsTxt}.`;
            if (gapsTxt) s += ` Pontos de melhoria: ${gapsTxt}.`;
            return s;
        }

        // Resumo executivo individual — evolução de score + o que melhorou e o
        // que ainda precisa desenvolver, comparando as sessões mais antigas com
        // as mais recentes do mesmo corretor.
        function personExecutiveSummary(p) {
            const firstName = p.name.trim().split(' ')[0];
            const { strengths } = computeNetSkills(p.strengthCounts, p.gapCounts);
            const improvedTxt = joinSkillLabels(p.resolvedGaps, 2);
            const stillTxt = joinSkillLabels(p.persistentGaps, 2);
            // não repete uma competência já citada como "pontos de melhoria" (persistente
            // ou já resolvida) na lista de "ponto forte consistente" — evita a mesma
            // competência aparecer simultaneamente nos dois lados do resumo.
            const consistentStrengthKeys = strengths.map(s => s.key).filter(k => !p.resolvedGaps.includes(k) && !p.persistentGaps.includes(k));
            const topStrengthTxt = joinSkillLabels(consistentStrengthKeys, 2);

            const parts = [];
            if (currentLang === 'fr') {
                if (p.count > 1) {
                    if (p.delta > 0) parts.push(`${firstName} a progressé de ${p.delta} points depuis sa première session évaluée (${p.firstScore}% → ${p.lastScore}%)`);
                    else if (p.delta < 0) parts.push(`${firstName} a reculé de ${Math.abs(p.delta)} points depuis sa première session évaluée (${p.firstScore}% → ${p.lastScore}%)`);
                    else parts.push(`${firstName} maintient un score stable, autour de ${p.avgScore}%`);
                } else {
                    parts.push(`${firstName} a une session évaluée, avec un score de ${p.avgScore}%`);
                }
                if (topStrengthTxt) parts.push(`point fort constant en ${topStrengthTxt}`);
                if (improvedTxt) parts.push(`a progressé en ${improvedTxt}`);
                if (stillTxt) parts.push(`points de développement : ${stillTxt}`);
                return parts.join('. ') + '.';
            }

            if (p.count > 1) {
                if (p.delta > 0) parts.push(`${firstName} evoluiu ${p.delta} pontos percentuais desde a primeira sessão avaliada (${p.firstScore}% → ${p.lastScore}%)`);
                else if (p.delta < 0) parts.push(`${firstName} caiu ${Math.abs(p.delta)} pontos percentuais desde a primeira sessão avaliada (${p.firstScore}% → ${p.lastScore}%)`);
                else parts.push(`${firstName} mantém um score estável, em torno de ${p.avgScore}%`);
            } else {
                parts.push(`${firstName} tem uma sessão avaliada, com score de ${p.avgScore}%`);
            }
            if (topStrengthTxt) parts.push(`ponto forte consistente em ${topStrengthTxt}`);
            if (improvedTxt) parts.push(`já evoluiu em ${improvedTxt}`);
            if (stillTxt) parts.push(`pontos de melhoria: ${stillTxt}`);
            return parts.join('. ') + '.';
        }

        // Resumo de características em bullets, agregado a partir de TODAS as
        // simulações da pessoa (não de uma corrida específica) — ao contrário do
        // campo estático `insights` (que descreve apenas uma sessão pontual), este
        // resumo reflete o padrão de comportamento consolidado da pessoa.
        function characteristicsBullets(p) {
            if (!p) return [];
            const { strengths } = computeNetSkills(p.strengthCounts, p.gapCounts);
            const consistentStrengthKeys = strengths.map(s => s.key).filter(k => !p.resolvedGaps.includes(k) && !p.persistentGaps.includes(k));
            const topStrengthTxt = joinSkillLabels(consistentStrengthKeys, 3);
            const improvedTxt = joinSkillLabels(p.resolvedGaps, 2);
            const stillTxt = joinSkillLabels(p.persistentGaps, 2);
            const bullets = [];

            if (currentLang === 'fr') {
                bullets.push(p.count > 1
                    ? `Score moyen de ${p.avgScore}% sur ${p.count} simulations évaluées.`
                    : `Score de ${p.avgScore}% sur son unique simulation évaluée.`);
                if (topStrengthTxt) bullets.push(`Point fort constant : ${topStrengthTxt}.`);
                if (stillTxt) bullets.push(`Points de développement récurrents : ${stillTxt}.`);
                if (improvedTxt) bullets.push(`A déjà progressé en : ${improvedTxt}.`);
                if (p.count > 1 && p.delta !== 0) {
                    bullets.push(p.delta > 0
                        ? `Évolution positive de ${p.delta} points entre la première et la dernière simulation.`
                        : `Recul de ${Math.abs(p.delta)} points entre la première et la dernière simulation.`);
                }
                return bullets;
            }

            bullets.push(p.count > 1
                ? `Score médio de ${p.avgScore}% em ${p.count} simulações avaliadas.`
                : `Score de ${p.avgScore}% na única simulação avaliada.`);
            if (topStrengthTxt) bullets.push(`Ponto forte consistente: ${topStrengthTxt}.`);
            if (stillTxt) bullets.push(`Pontos de desenvolvimento recorrentes: ${stillTxt}.`);
            if (improvedTxt) bullets.push(`Já evoluiu em: ${improvedTxt}.`);
            if (p.count > 1 && p.delta !== 0) {
                bullets.push(p.delta > 0
                    ? `Evolução de ${p.delta} pontos percentuais entre a primeira e a última simulação.`
                    : `Queda de ${Math.abs(p.delta)} pontos percentuais entre a primeira e a última simulação.`);
            }
            return bullets;
        }

        const SS_STRENGTH_RE = /pontos?\s+forte?s?(?:\s+da\s+interven[cç][aã]o)?\s*:?|points?\s+forts?(?:\s+de\s+l['’]interven\w*)?\s*:?/gi;
        const SS_IMPROVEMENT_RE = /pontos?\s+de\s+melhoria(?:\s+da\s+interven[cç][aã]o)?\s*:?|eixos?\s+de\s+melhoria\s*:?|[aá]reas?\s+de\s+melhoria\s*:?|axes?\s+d['’]am[ée]lior\w*(?:\s+de\s+l['’]interven\w*)?\s*:?|eixos?\s+de\s+desenvolvimento\s*:?|[aá]reas?\s+de\s+desenvolvimento\s*:?|pontos?\s+de\s+desenvolvimento\s*:?|pontos?\s+a\s+desenvolver\s*:?/gi;
        // Observação: frases curtas e genéricas como "a melhorar"/"a aprimorar" foram
        // propositalmente excluídas da lista acima — mesmo motivo documentado no
        // dashboard Fairmont: evita cortes de frase incorretos em texto corrido.
        const SS_NEUTRAL_RE = /an[áa]lise\s+emocional|analyse\s+[ée]motionnelle|recomenda[çc][õo]es|recommandations|verifica[çc][õo]es\s+factuais|\bpersona\b|vis[ãa]o\s+geral|objetivo\s+principal|momento[\s-]chave|para\s+lembrar|oportunidades\s+perdidas|mapa\s+de\s+compet[êe]ncias/gi;

        function heuristicPivotSplit(fb) {
            const pivotRegex = /(no entanto|contudo|todavia|entretanto|cependant|toutefois|neanmoins|néanmoins|para enriquecer|pour enrichir|sugiro|je te conseille|je vous conseille|je vous invite|uma dica|outra dica|erro comum)/i;
            const m = pivotRegex.exec(fb);
            let head = fb, tail = '';
            if (m) { head = fb.slice(0, m.index); tail = fb.slice(m.index); }
            const splitSentences = (t) => t.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.length > 25);
            let strengths = splitSentences(head).slice(m ? -3 : 0, m ? undefined : 2);
            let improvements = m ? splitSentences(tail).slice(0, 3) : [];
            return { strengths, improvements };
        }

        function splitFeedbackSections(rawFeedback) {
            const fb = fixEnc(rawFeedback || '').replace(/\[(linha em branco|ligne vide)\]/gi, '').trim();
            if (!fb) return { strengths: [], improvements: [] };

            let hits = [];
            [['strength', SS_STRENGTH_RE], ['improvement', SS_IMPROVEMENT_RE], ['other', SS_NEUTRAL_RE]].forEach(([type, re]) => {
                re.lastIndex = 0;
                let match;
                while ((match = re.exec(fb)) !== null) {
                    hits.push({ idx: match.index, end: match.index + match[0].length, type });
                    if (match[0].length === 0) re.lastIndex++;
                }
            });

            if (!hits.length) return heuristicPivotSplit(fb);

            hits.sort((a, b) => a.idx - b.idx);
            const merged = [];
            hits.forEach(h => {
                const last = merged[merged.length - 1];
                if (last && h.idx - last.end < 3) return;
                merged.push(h);
            });

            let strengths = [], improvements = [];
            for (let i = 0; i < merged.length; i++) {
                const cur = merged[i];
                if (cur.type === 'other') continue;
                const start = cur.end;
                const end = (i + 1 < merged.length) ? merged[i + 1].idx : fb.length;
                let body = fb.slice(start, end).replace(/^[:,.\-—–#\s]+/, '').trim();
                if (!body) continue;
                const lines = body.split('\n')
                    .map(l => l.replace(/^[\s\-•▶🟢🔴🟡➕⚠️#]+/, '').trim())
                    .filter(l => l.length > 12 && !/^\[(linha em branco|ligne vide|\.\.\.)\]$/i.test(l));
                const chunks = lines.length > 1 ? lines : body.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.length > 15);
                if (cur.type === 'strength') strengths.push(...chunks.slice(0, 4));
                else improvements.push(...chunks.slice(0, 4));
            }

            if (!strengths.length && !improvements.length) return heuristicPivotSplit(fb);
            return { strengths, improvements };
        }

        function tagSkills(sentences) {
            const counts = {};
            SALES_SKILLS.forEach(sk => counts[sk.key] = 0);
            (sentences || []).forEach(sent => {
                const n = normTxt(sent);
                SALES_SKILLS.forEach(sk => {
                    if (sk.kw.some(k => n.includes(normTxt(k)))) counts[sk.key]++;
                });
            });
            return counts;
        }

        function topSkillKeys(counts, n) {
            return Object.entries(counts).filter(([k, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, n).map(([k]) => k);
        }

        // Base de sessões elegível: finalizadas, com nota e com debriefing de texto
        function getSoftSkillsSims() {
            return VALID_SIMS.filter(s => s.finished && s.feedback && s.score !== null && s.score !== undefined);
        }

        function buildPersonProfile(name, sims) {
            const mine = sims.filter(s => s.name === name).sort((a, b) => parseDateBR(a.date) - parseDateBR(b.date));
            if (!mine.length) return null;

            let strengthCounts = {}, gapCounts = {};
            SALES_SKILLS.forEach(sk => { strengthCounts[sk.key] = 0; gapCounts[sk.key] = 0; });

            const sessions = mine.map(s => {
                const parsed = splitFeedbackSections(s.feedback);
                const sC = tagSkills(parsed.strengths);
                const gC = tagSkills(parsed.improvements);
                SALES_SKILLS.forEach(sk => { strengthCounts[sk.key] += sC[sk.key]; gapCounts[sk.key] += gC[sk.key]; });
                return {
                    date: s.date, score: s.score, scenario: s.scenario,
                    strengths: parsed.strengths, improvements: parsed.improvements,
                    gapKeys: Object.entries(gC).filter(([k, v]) => v > 0).map(([k]) => k)
                };
            });

            const scores = mine.map(s => s.score);
            const avgScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
            const firstScore = scores[0], lastScore = scores[scores.length - 1];
            const delta = scores.length > 1 ? (lastScore - firstScore) : 0;

            const n = sessions.length;
            const splitAt = n >= 3 ? Math.floor(n / 2) : (n === 2 ? 1 : n);
            const earlySessions = sessions.slice(0, splitAt);
            const recentSessions = n === 1 ? sessions : sessions.slice(splitAt);
            const earlyGapSet = new Set(earlySessions.flatMap(s => s.gapKeys));
            const recentGapSet = new Set(recentSessions.flatMap(s => s.gapKeys));
            const recentGapCounts = {};
            recentSessions.forEach(s => s.gapKeys.forEach(k => { recentGapCounts[k] = (recentGapCounts[k] || 0) + 1; }));
            const earlyGapCounts = {};
            earlySessions.forEach(s => s.gapKeys.forEach(k => { earlyGapCounts[k] = (earlyGapCounts[k] || 0) + 1; }));
            const resolvedGaps = [...earlyGapSet].filter(k => !recentGapSet.has(k))
                .sort((a, b) => (earlyGapCounts[b] || 0) - (earlyGapCounts[a] || 0));
            const persistentGaps = [...recentGapSet]
                .sort((a, b) => (recentGapCounts[b] || 0) - (recentGapCounts[a] || 0));

            // Recupera o Resumo Comportamental Técnico estático (insights) da pessoa,
            // a mesma fonte usada no card individual do dashboard principal.
            const original = (typeof users !== 'undefined' ? users : []).find(u => cleanName(u.name) === cleanName(name)) || {};
            const insights = original.insights || { pt: [], fr: [] };

            return {
                name,
                count: mine.length,
                avgScore, firstScore, lastScore, delta,
                sessions,
                strengthCounts, gapCounts,
                resolvedGaps, persistentGaps,
                insights,
                topStrengths: topSkillKeys(strengthCounts, 3),
                topGaps: topSkillKeys(gapCounts, 3)
            };
        }

        function getSoftSkillAreas() {
            const sims = getSoftSkillsSims();
            const areaMap = {};
            sims.forEach(s => {
                const area = getArea(s.scenario);
                (areaMap[area] = areaMap[area] || []).push(s);
            });
            return Object.entries(areaMap).map(([area, list]) => {
                const names = [...new Set(list.map(s => s.name))];
                const avgScore = Math.round(list.reduce((a, b) => a + b.score, 0) / list.length);
                let strengthCounts = {}, gapCounts = {};
                SALES_SKILLS.forEach(sk => { strengthCounts[sk.key] = 0; gapCounts[sk.key] = 0; });
                list.forEach(s => {
                    const parsed = splitFeedbackSections(s.feedback);
                    const sC = tagSkills(parsed.strengths), gC = tagSkills(parsed.improvements);
                    SALES_SKILLS.forEach(sk => { strengthCounts[sk.key] += sC[sk.key]; gapCounts[sk.key] += gC[sk.key]; });
                });
                return {
                    area, memberCount: names.length, sessionCount: list.length, avgScore,
                    strengthCounts, gapCounts,
                    topStrengths: topSkillKeys(strengthCounts, 3),
                    topGaps: topSkillKeys(gapCounts, 3)
                };
            }).sort((a, b) => b.sessionCount - a.sessionCount);
        }

        function showSoftSkillsHome() {
            hideSimNav();
            window.activeUser = null;
            currentView = 'softskills';
            currentSoftSkillArea = null;
            syncNavActive();
            renderUserList();
            renderSoftSkillsHome();
        }

        function renderSoftSkillsHome() {
            const L = ui[currentLang];
            const areas = getSoftSkillAreas();
            const totalSessions = areas.reduce((a, b) => a + b.sessionCount, 0);
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="global-stats">
                    <header class="header-section">
                        <div class="header-content-left">
                            <h1>${L.softSkillsTitle} <span>${L.softSkillsTitleAccent}</span></h1>
                            <p style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-top: 8px;">
                                <i class="fas fa-user-tie"></i> ${totalSessions} ${L.softSkillsSessionsAnalyzed}
                            </p>
                        </div>
                        <div class="header-content-right">
                            <p class="header-desc">${L.softSkillsSubtitle}</p>
                        </div>
                    </header>

                    <div class="softskills-area-grid">
                        ${areas.map(a => renderAreaCard(a)).join('') || `<div class="card">${L.waitingData}</div>`}
                    </div>

                    <div class="card">
                        <h3 style="color: var(--accent); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.1em; margin-bottom: 1.6rem;">
                            <i class="fas fa-graduation-cap" style="color: var(--primary);"></i> ${L.expectedBehaviorTitle}
                        </h3>
                        <div class="expected-behavior-grid">
                            ${SALES_SKILLS.map(sk => `
                                <div class="expected-behavior-item">
                                    <span class="ebi-emoji">${sk.emoji}</span>
                                    <div>
                                        <div class="ebi-title">${sk[currentLang]}</div>
                                        <div class="ebi-desc">${sk.desc[currentLang]}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAreaCard(a) {
            const L = ui[currentLang];
            const areaLabel = L['area' + a.area.replace(/\s/g, '')] || a.area;
            const { strengths, gaps } = computeNetSkills(a.strengthCounts, a.gapCounts);
            const strengthsTxt = joinSkillLabels(strengths.map(s => s.key), 3);
            const gapsTxt = joinSkillLabels(gaps.map(g => g.key), 2);
            return `
                <div class="softskills-area-card" onclick="showSoftSkillArea('${a.area.replace(/'/g, "\\'")}')">
                    <div class="ssac-header">
                        <h3>${areaLabel}</h3>
                        <span class="ssac-score">${a.avgScore}%</span>
                    </div>
                    <div class="ssac-meta">
                        <span><i class="fas fa-user-tie"></i> ${a.memberCount} ${L.collaborators.toLowerCase()}</span>
                        <span><i class="fas fa-comments"></i> ${a.sessionCount} ${L.sessions.toLowerCase()}</span>
                    </div>
                    <p class="ssac-characteristic">
                        ${strengthsTxt ? `<strong class="txt-strength">${L.goodDominionOf}</strong> ${strengthsTxt}.` : ''}
                        ${gapsTxt ? `<strong class="txt-gap">${L.stillNeedsToDevelop}</strong> ${gapsTxt}.` : ''}
                        ${(!strengthsTxt && !gapsTxt) ? L.noPatternYet : ''}
                    </p>
                    <div class="ssac-cta">${L.viewDetails} <i class="fas fa-arrow-right"></i></div>
                </div>
            `;
        }

        function showSoftSkillArea(area) {
            currentSoftSkillArea = area;
            renderSoftSkillAreaDetail();
        }

        function renderSoftSkillAreaDetail() {
            const L = ui[currentLang];
            const sims = getSoftSkillsSims().filter(s => getArea(s.scenario) === currentSoftSkillArea);
            const names = [...new Set(sims.map(s => s.name))];
            const profiles = names.map(n => buildPersonProfile(n, sims)).filter(Boolean).sort((a, b) => b.avgScore - a.avgScore);
            const areaLabel = L['area' + currentSoftSkillArea.replace(/\s/g, '')] || currentSoftSkillArea;
            const areaEntry = getSoftSkillAreas().find(a => a.area === currentSoftSkillArea);
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div id="softSkillsAreaDetail">
                    <button onclick="showSoftSkillsHome()" class="btn-secondary" style="font-size: 0.85rem; padding: 10px 18px; border-radius: 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 1.5rem;">
                        <i class="fas fa-arrow-left"></i> ${L.back}
                    </button>
                    <header class="header-section" style="padding: 2.5rem !important; min-height: auto; margin-bottom: 2rem !important;">
                        <div class="header-content-left">
                            <h1>${areaLabel}</h1>
                            <p class="header-desc" style="margin-top: 10px;">${L.softSkillsAreaDesc}</p>
                        </div>
                    </header>

                    <div class="card" style="margin-bottom: 2rem;">
                        <h3 style="color: var(--accent); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.1em; margin-bottom: 1.2rem;">
                            <i class="fas fa-layer-group" style="color: var(--primary);"></i> ${L.areaSynthesisTitle}
                        </h3>
                        ${areaEntry ? `<p class="executive-summary">${areaExecutiveSummary(areaEntry)}</p>` : ''}
                        ${areaEntry ? renderSkillSynthesis(areaEntry.strengthCounts, areaEntry.gapCounts) : ''}
                    </div>

                    <div class="softskills-person-list">
                        ${profiles.map(p => renderPersonCard(p)).join('') || `<div class="card">${L.waitingData}</div>`}
                    </div>
                </div>
            `;
            profiles.forEach(p => drawSparkline(p));
        }

        function safeId(name) {
            return 'ss-' + name.replace(/[^a-zA-Z0-9]/g, '');
        }

        function renderPersonCard(p) {
            const L = ui[currentLang];
            const deltaClass = p.delta > 0 ? 'up' : (p.delta < 0 ? 'down' : 'flat');
            const deltaIcon = p.delta > 0 ? 'fa-arrow-trend-up' : (p.delta < 0 ? 'fa-arrow-trend-down' : 'fa-minus');
            const id = safeId(p.name);
            const charBullets = characteristicsBullets(p);
            return `
            <div class="softskills-person-card">
                <div class="sspc-top" onclick="togglePersonDetail('${id}')">
                    <div>
                        <div class="sspc-name">${p.name}</div>
                        <div class="sspc-meta">${p.count} ${L.sessions.toLowerCase()} • ${L.avgScore}: <strong>${p.avgScore}%</strong></div>
                    </div>
                    <div class="sspc-right">
                        <canvas id="spark-${id}" width="120" height="36"></canvas>
                        ${p.count > 1 ? `<span class="evolution-badge ${deltaClass}"><i class="fas ${deltaIcon}"></i> ${p.delta > 0 ? '+' : ''}${p.delta}%</span>` : ''}
                        <i class="fas fa-chevron-down toggle-caret" id="caret-${id}"></i>
                    </div>
                </div>
                <div class="sspc-synthesis">
                    <h5 class="ss-inline-title">${L.personSynthesisTitle}</h5>
                    <p class="executive-summary">${personExecutiveSummary(p)}</p>
                    ${renderSkillSynthesis(p.strengthCounts, p.gapCounts)}
                    ${charBullets.length ? `
                    <div class="insight-box" style="margin-top: 1.5rem;">
                        <div class="insight-header">
                            <i class="fas fa-lightbulb"></i>
                            <h4>${L.contextLabel}</h4>
                        </div>
                        <ul class="bullet-list">
                            ${charBullets.map(txt => `<li>${txt}</li>`).join('')}
                        </ul>
                    </div>` : ''}
                </div>
                <div class="sspc-detail" id="detail-${id}" style="display: none;">
                    <h4>${L.evolutionHistory}</h4>
                    <div class="session-history">
                        ${p.sessions.map(s => `
                            <div class="session-history-item">
                                <div class="shi-top">
                                    <span class="shi-date">${s.date}</span>
                                    <span class="shi-scenario">${translateScenario(s.scenario)}</span>
                                    <span class="shi-score">${s.score}%</span>
                                </div>
                                ${s.strengths.length ? `<div class="shi-block strength"><strong>${L.strengthsLabel}:</strong> ${fixEnc(s.strengths.join(' '))}</div>` : ''}
                                ${s.improvements.length ? `<div class="shi-block gap"><strong>${L.improvementsLabel}:</strong> ${fixEnc(s.improvements.join(' '))}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>`;
        }

        function togglePersonDetail(id) {
            const el = document.getElementById('detail-' + id);
            const caret = document.getElementById('caret-' + id);
            if (!el) return;
            const isOpen = el.style.display !== 'none';
            el.style.display = isOpen ? 'none' : 'block';
            if (caret) caret.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        function drawSparkline(p) {
            const id = safeId(p.name);
            const canvas = document.getElementById('spark-' + id);
            if (!canvas || typeof Chart === 'undefined') return;
            new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: p.sessions.map(s => s.date),
                    datasets: [{
                        data: p.sessions.map(s => s.score),
                        borderColor: '#00bcf2',
                        backgroundColor: 'rgba(0,188,242,0.10)',
                        borderWidth: 2, pointRadius: 0, tension: 0.35, fill: true
                    }]
                },
                options: {
                    responsive: false, animation: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } }
                }
            });
        }

        // Initialize
        const savedLang = localStorage.getItem('metlifeLang') || 'pt';
        setLang(savedLang);
    </script>
</body>

</html>
